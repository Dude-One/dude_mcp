# Dude MCP — panel server + MCP server + database
#
# Start everything:
#   docker compose up -d --build
#
# DB only:
#   docker compose up -d dude-mcp-db
#
# Rebuild after code changes:
#   docker compose up -d --build dude-mcp-server dude-mcp-mcp

services:
  dude-mcp-db:
    build:
      context: ./infra/auth-db
      dockerfile: Dockerfile
    container_name: dude-mcp-db
    restart: unless-stopped
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: dude_mcp_db
      POSTGRES_USER: dude_mcp
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-dude_mcp_dev}
    volumes:
      - dude_mcp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dude_mcp -d dude_mcp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dude-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dude-mcp-server
    command: ["./dude-mcp", "server"]
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dude_mcp:${AUTH_DB_PASSWORD:-dude_mcp_dev}@dude-mcp-db:5432/dude_mcp_db?sslmode=disable
      MCP_ADMIN_URL: "http://dude-mcp-mcp:8082"
    depends_on:
      dude-mcp-db:
        condition: service_healthy

  dude-mcp-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dude-mcp-mcp
    command: ["./dude-mcp", "mcp"]
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8081}:8081"
    environment:
      MCP_PORT: "8081"
      MCP_ADMIN_PORT: "8082"
      DATABASE_URL: postgres://dude_mcp:${AUTH_DB_PASSWORD:-dude_mcp_dev}@dude-mcp-db:5432/dude_mcp_db?sslmode=disable
    depends_on:
      dude-mcp-db:
        condition: service_healthy

volumes:
  dude_mcp_data:
